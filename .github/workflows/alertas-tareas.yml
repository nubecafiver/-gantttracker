name: Alertas de tareas sin actualizar

on:
  schedule:
    - cron: '0 14 * * *'  # 8am Ciudad de México (UTC-6) = 14:00 UTC
  workflow_dispatch:       # También se puede correr manualmente

jobs:
  revisar-tareas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install node-fetch@2 emailjs-com
      - name: Revisar tareas y enviar alertas
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DIAS_LIMITE: '3'
        run: node .github/scripts/revisar-tareas.js
