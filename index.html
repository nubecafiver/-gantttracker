<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttTracker Pro — APP CAFIVER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase Compat SDK (carga síncrona, sin módulos ES6) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1a73e8;min-height:100vh;color:#1c1e21;font-size:13px;}
body.app-mode{background:#f5f6f8;}
.hidden{display:none!important;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#c8cad0;border-radius:3px;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.lcard{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:380px;box-shadow:0 12px 48px rgba(0,0,0,.3);}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:6px;border:1px solid #c8cad0;background:#fff;color:#1c1e21;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;}
.btn:hover{background:#f0f1f3;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-blue{background:#1a73e8;color:#fff;border-color:#1a73e8;}
.btn-blue:hover{background:#1557b0;}
.btn-red{background:#fce8e6;color:#ea4335;border-color:transparent;}
.btn-red:hover{background:#fbd7d4;}
.fi{font-size:13px;padding:10px 12px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;font-family:'Inter',sans-serif;width:100%;transition:border-color .15s;}
.fi:focus{border-color:#1a73e8;}

/* APP */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{height:52px;background:#fff;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:50;}
.logo-mark{width:28px;height:28px;background:#1a73e8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.proj-name{font-size:14px;font-weight:700;}
.tnav{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:#5f6368;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;transition:all .15s;}
.tnav:hover{background:#f0f1f3;color:#1c1e21;}
.tnav.on{background:#e8f0fe;color:#1a73e8;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.user-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#f0f1f3;font-size:12px;font-weight:500;}
.cu-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.sync-pill{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500;}
.sync-pill.ok{background:#e6f4ea;color:#2d6a2d;}
.sync-pill.saving{background:#e8f0fe;color:#1a73e8;}
.sync-pill.error{background:#fce8e6;color:#c0392b;}

.secbar{height:38px;background:#fff;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0;}
.secbar-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:#5f6368;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;transition:all .15s;}
.secbar-btn:hover{background:#f0f1f3;}
.today-btn{color:#1a73e8;font-weight:700;}
.sep{width:1px;height:18px;background:#e0e2e6;margin:0 2px;}

/* GANTT */
.gantt-shell{flex:1;display:flex;overflow:hidden;}
.gantt-left{width:420px;min-width:420px;display:flex;flex-direction:column;border-right:2px solid #e0e2e6;overflow:hidden;flex-shrink:0;}
.gl-head{height:34px;display:grid;grid-template-columns:1fr 72px;align-items:center;background:#f0f1f3;border-bottom:1px solid #e0e2e6;padding:0 8px;flex-shrink:0;}
.gl-head span{font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.04em;}
.gl-body{overflow-y:scroll;overflow-x:hidden;height:100%;scrollbar-width:none;-ms-overflow-style:none;} .gl-body::-webkit-scrollbar{display:none;}
.grow{height:34px;min-height:34px;max-height:34px;display:grid;grid-template-columns:1fr 72px;align-items:center;border-bottom:1px solid #e0e2e6;cursor:pointer;transition:background .1s;user-select:none;box-sizing:border-box;}
.grow:hover{background:#f7f8ff;}
.grow.grp{background:#f0f1f3;cursor:default;}
.grow.grp:hover{background:#ecedf0;}
.grow.sel{background:#e8f0fe!important;}
.gcell-n{display:flex;align-items:center;gap:5px;padding:0 8px;overflow:hidden;}
.gcell-p{text-align:center;font-size:12px;font-weight:700;padding-right:8px;}
.gtog{background:none;border:none;cursor:pointer;color:#9aa0a6;font-size:10px;padding:2px;flex-shrink:0;transition:transform .2s;line-height:1;}
.gtog.open{transform:rotate(90deg);}
.task-lbl{font-size:12px;color:#1c1e21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.task-indent{width:18px;flex-shrink:0;}
.gantt-right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cal-hd-wrap{flex-shrink:0;overflow:hidden;}
.month-hd{height:20px;display:flex;background:#e8eaed;border-bottom:1px solid #e0e2e6;}
.month-seg{display:flex;align-items:center;font-size:11px;font-weight:700;color:#5f6368;border-right:1px solid #e0e2e6;padding:0 6px;white-space:nowrap;overflow:hidden;}
.day-hd{display:flex;height:34px;background:#f0f1f3;border-bottom:1px solid #e0e2e6;}
.day-col{width:28px;min-width:28px;border-right:1px solid #e0e2e6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.day-col .dow{color:#9aa0a6;font-weight:500;line-height:1;}
.day-col .dom{font-weight:600;color:#5f6368;line-height:1.5;font-size:10px;}
.day-col.tod .dom{background:#1a73e8;color:#fff;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;}
.day-col.tod .dow{color:#1a73e8;}
.day-col.we{background:#fafafa;}
.cal-bw{flex:1;overflow:auto;position:relative;} .cal-b{min-height:100%;}
.cal-b{position:relative;}
.cal-row{height:34px;min-height:34px;max-height:34px;display:flex;position:relative;border-bottom:1px solid #e0e2e6;box-sizing:border-box;}
.cal-row.grp-r{background:#f0f1f3;}
.dcell{width:28px;min-width:28px;border-right:1px solid #e0e2e6;height:100%;flex-shrink:0;}
.dcell.we{background:#fafafa;}
.dcell.tod{background:#e8f0fe18;}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:4px;cursor:pointer;overflow:hidden;display:flex;align-items:center;}
.bar:hover{filter:brightness(.9);}
.bar-bg{position:absolute;inset:0;border-radius:4px;}
.bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;}
.bar-txt{position:relative;z-index:1;font-size:10px;font-weight:600;color:#fff;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.tline{position:absolute;top:0;bottom:0;width:2px;background:#1a73e8;opacity:.8;z-index:10;pointer-events:none;}

/* DETAIL PANEL */
#dp{position:fixed;top:0;right:0;width:500px;height:100vh;background:#fff;border-left:1px solid #e0e2e6;z-index:200;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.1);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#dp.open{transform:translateX(0);}
.dp-pct-bar{height:5px;background:#1a73e8;transition:width .3s;}
.dp-hd{padding:14px 18px 10px;border-bottom:1px solid #e0e2e6;flex-shrink:0;}
.dp-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.dp-title{flex:1;font-size:15px;font-weight:700;border:none;outline:none;background:transparent;resize:none;line-height:1.4;font-family:'Inter',sans-serif;color:#1c1e21;}
.dp-acts{display:flex;gap:4px;flex-shrink:0;}
.dp-ib{background:none;border:none;cursor:pointer;color:#9aa0a6;font-size:15px;padding:4px;border-radius:6px;transition:all .15s;}
.dp-ib:hover{background:#f0f1f3;color:#5f6368;}
.dp-ib.dng:hover{background:#fce8e6;color:#ea4335;}
.dp-meta{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.dp-mf label{display:block;font-size:10px;font-weight:700;color:#9aa0a6;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.dp-pct-blk{display:flex;align-items:center;gap:8px;background:#e8f0fe;border-radius:8px;padding:6px 10px;}
.dp-pct-n{font-size:18px;font-weight:700;color:#1a73e8;width:42px;border:none;background:transparent;outline:none;font-family:'Inter',sans-serif;}
.dp-pct-s{flex:1;min-width:80px;accent-color:#1a73e8;}
.dp-date{font-size:12px;padding:5px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;}
.dp-date:focus{border-color:#1a73e8;}
.dp-tabs{display:flex;border-bottom:1px solid #e0e2e6;padding:0 18px;flex-shrink:0;}
.dp-tab{padding:9px 14px;font-size:12px;font-weight:600;color:#5f6368;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;font-family:'Inter',sans-serif;}
.dp-tab:hover{color:#1c1e21;}
.dp-tab.on{color:#1a73e8;border-bottom-color:#1a73e8;}
.dp-body{flex:1;overflow-y:auto;padding:16px 18px;}
.dp-sec{margin-bottom:14px;}
.dp-sec-t{font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.dp-fr{display:grid;grid-template-columns:130px 1fr;align-items:center;padding:7px 0;border-bottom:1px solid #e0e2e6;}
.dp-fr:last-child{border-bottom:none;}
.dp-fk{font-size:12px;color:#5f6368;font-weight:500;}
.dp-fv input,.dp-fv select,.dp-fv textarea{width:100%;font-size:12px;padding:4px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;font-family:'Inter',sans-serif;}
.dp-fv input:focus,.dp-fv select:focus{border-color:#1a73e8;}
.dp-fv textarea{resize:vertical;min-height:90px;line-height:1.5;}
.sem-row{display:flex;gap:8px;}
.sem-opt{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;cursor:pointer;border:1.5px solid #e0e2e6;font-size:11px;font-weight:600;transition:all .15s;}
.sem-g{color:#34a853;}.sem-g.on{background:#e6f4ea;border-color:#34a853;}
.sem-y{color:#f9ab00;}.sem-y.on{background:#fef7e0;border-color:#f9ab00;}
.sem-r{color:#ea4335;}.sem-r.on{background:#fce8e6;border-color:#ea4335;}
.semdot{width:9px;height:9px;border-radius:50%;}
.notes-area{width:100%;min-height:120px;font-size:13px;padding:10px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;line-height:1.6;resize:vertical;font-family:'Inter',sans-serif;}
.notes-area:focus{border-color:#1a73e8;}
.c-box{display:flex;gap:8px;margin-bottom:14px;}
.c-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;}
.c-inp{flex:1;font-size:12px;padding:8px 10px;border:1.5px solid #e0e2e6;border-radius:8px;outline:none;font-family:'Inter',sans-serif;}
.c-inp:focus{border-color:#1a73e8;}
.c-item{display:flex;gap:8px;margin-bottom:10px;}
.c-txt{flex:1;background:#f0f1f3;border-radius:8px;padding:8px 10px;}
.c-author{font-size:11px;font-weight:700;margin-bottom:2px;}
.c-body{font-size:12px;color:#5f6368;line-height:1.5;}
.c-time{font-size:10px;color:#9aa0a6;margin-top:3px;}
.pred-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e0e2e6;font-size:12px;}
.pred-item:last-child{border-bottom:none;}
.no-pred{font-size:12px;color:#9aa0a6;font-style:italic;padding:6px 0;}
#dp-overlay{position:fixed;inset:0;z-index:199;display:none;}
#dp-overlay.on{display:block;}

/* MODALS */
#at-overlay,#confirm-overlay,#proj-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:400;}
.at-card,.confirm-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.at-card{width:480px;max-width:96vw;max-height:92vh;overflow-y:auto;}
.confirm-card{width:340px;}
.at-card h3,.confirm-card h3{font-size:15px;font-weight:700;margin-bottom:1rem;}
.confirm-card p{font-size:13px;color:#5f6368;line-height:1.6;margin-bottom:1rem;}
.confirm-btns,.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid #e0e2e6;}
.af{margin-bottom:10px;}
.af label{display:block;font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.af input,.af select,.af textarea{width:100%;font-size:12px;padding:7px 10px;border:1.5px solid #e0e2e6;border-radius:7px;outline:none;font-family:'Inter',sans-serif;}
.af input:focus,.af select:focus{border-color:#1a73e8;}
.af textarea{resize:vertical;min-height:70px;line-height:1.5;}
.af-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.view-wrap{flex:1;overflow:auto;padding:1rem 1.5rem;}
.tbl-box{background:#fff;border:1px solid #e0e2e6;border-radius:12px;overflow:hidden;}
.tbl-hdr{padding:10px 14px;background:#f0f1f3;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;justify-content:space-between;}
.tbl-hdr span{font-size:13px;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5f6368;padding:7px 10px;border-bottom:1px solid #e0e2e6;background:#f0f1f3;text-align:left;white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid #e0e2e6;font-size:12px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.empty-state{padding:2rem;text-align:center;color:#9aa0a6;font-size:13px;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#323232;color:#fff;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media print{#dp,#dp-overlay,#at-overlay,#confirm-overlay,.topbar-right,.secbar{display:none!important;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lcard">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:56px;height:56px;background:#1a73e8;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 4px 16px rgba(26,115,232,.35);">
        <span style="color:#fff;font-size:26px;font-weight:700;">G</span>
      </div>
      <div style="font-size:20px;font-weight:700;color:#1c1e21;">GanttTracker Pro</div>
      <div style="font-size:12px;color:#5f6368;margin-top:4px;">APP CAFIVER</div>
    </div>

    <div id="login-error" style="display:none;background:#fce8e6;color:#c0392b;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;line-height:1.5;"></div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label style="font-size:11px;font-weight:600;color:#5f6368;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px;">Correo electrónico</label>
        <input class="fi" type="email" id="login-email" placeholder="correo@cafiver.com.mx" autocomplete="email">
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:#5f6368;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px;">Contraseña</label>
        <div style="position:relative;">
          <input class="fi" type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px;letter-spacing:2px;">
          <button id="toggle-pass-btn" type="button" title="Mostrar/ocultar contraseña"
            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9aa0a6;font-size:18px;line-height:1;padding:4px;z-index:2;">👁</button>
        </div>
      </div>
      <button id="login-btn" type="button" style="background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;width:100%;">
        Iniciar sesión
      </button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo-mark">G</div>
    <span class="proj-name">APP CAFIVER</span>
    <button class="tnav on" id="tnav-gantt" onclick="switchView('gantt')">▦ Gantt</button>
    <button class="tnav" id="tnav-daily" onclick="switchView('daily')">📅 Diario</button>
    <button class="tnav" id="tnav-hist" onclick="switchView('hist')">◷ Historial</button>
    <button class="tnav" id="tnav-projects" onclick="switchView('projects')">📁 Proyectos</button>
    <div class="topbar-right">
      <div class="sync-pill ok" id="topbar-sync">
        <span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;"></span>
        <span id="topbar-sync-txt">En línea</span>
      </div>
      <div class="user-pill" style="cursor:pointer;" onclick="openChPass()" title="Cambiar contraseña">
        <div class="cu-av" id="cur-av"></div>
        <span id="cur-nm"></span>
        <span style="font-size:10px;color:#9aa0a6;">🔐</span>
      </div>
      <button class="btn btn-sm" onclick="openAddTask()">+ Tarea</button>
      <button class="btn btn-sm" onclick="window.print()">🖨</button>
      <button class="btn btn-sm" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="secbar" id="secbar">
    <button class="secbar-btn today-btn" onclick="goToday()">Today</button>
    <div class="sep"></div>
    <button class="secbar-btn" onclick="shiftDays(-14)">◀</button>
    <span id="date-range-lbl" style="font-size:12px;color:#5f6368;font-weight:500;min-width:220px;text-align:center;"></span>
    <button class="secbar-btn" onclick="shiftDays(14)">▶</button>
    <div class="sep"></div>
    <button class="secbar-btn" onclick="openAddTask()">+ Tarea</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:#5f6368;">Responsable:</span>
      <select id="resp-fil" onchange="renderGantt()" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #e0e2e6;outline:none;">
        <option value="ALL">Todos</option>
        <option value="U">Usuario</option><option value="T">TI</option>
        <option value="P">Proveedor</option><option value="S">Compartido</option>
      </select>
    </div>
  </div>

  <div id="view-gantt" style="flex:1;display:flex;overflow:hidden;flex-direction:column;">
    <!-- Fixed headers row -->
    <div style="display:flex;flex-shrink:0;border-bottom:1px solid #e0e2e6;">
      <!-- Left fixed header -->
      <div style="width:420px;min-width:420px;flex-shrink:0;border-right:2px solid #e0e2e6;">
        <div class="gl-head"><span>Name</span><span style="text-align:center;">Progress</span></div>
      </div>
      <!-- Right calendar header -->
      <div style="flex:1;overflow:hidden;">
        <div class="month-hd" id="month-hd" style="overflow:hidden;"></div>
        <div class="day-hd" id="day-hd" style="overflow:hidden;"></div>
      </div>
    </div>
    <!-- Scrollable body row -->
    <div style="flex:1;display:flex;overflow:hidden;">
      <!-- Left fixed rows -->
      <div style="width:420px;min-width:420px;flex-shrink:0;border-right:2px solid #e0e2e6;overflow:hidden;">
        <div class="gl-body" id="gl-body"></div>
      </div>
      <!-- Right calendar body -->
      <div class="cal-bw" id="cal-bw" style="flex:1;overflow:auto;position:relative;">
        <div class="cal-b" id="cal-b"></div>
        <div class="tline hidden" id="tline"></div>
      </div>
    </div>

document.getElementById('login-btn').addEventListener('click', doLogin);

document.getElementById('toggle-pass-btn').addEventListener('click', function(){
  var inp = document.getElementById('login-pass');
  inp.type = inp.type==='password' ? 'text' : 'password';
  document.getElementById('toggle-pass-btn').textContent = inp.type==='password' ? '👁' : '🙈';
});

function showLoginError(msg){
  var el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogin(){
  var email = (document.getElementById('login-email').value||'').trim().toLowerCase();
  var pass  = (document.getElementById('login-pass').value||'').trim();
  var btn   = document.getElementById('login-btn');
  document.getElementById('login-error').style.display = 'none';

  if(!email){ showLoginError('Escribe tu correo electrónico.'); return; }
  if(!pass){  showLoginError('Escribe tu contraseña.'); return; }

  btn.textContent = 'Entrando...';
  btn.disabled = true;
  btn.style.opacity = '0.7';

  auth.signInWithEmailAndPassword(email, pass)
    .then(function(cred){
      var profile = USER_DIR[email] || {name:email.split('@')[0], color:'#1a73e8'};
      curUser = {uid:cred.user.uid, email:email, name:profile.name, color:profile.color};
      enterApp();
    })
    .catch(function(e){
      btn.textContent = 'Iniciar sesión';
      btn.disabled = false;
      btn.style.opacity = '1';
      var msg = 'Correo o contraseña incorrectos.';
      if(e.code==='auth/user-not-found')      msg = 'Usuario no encontrado.';
      if(e.code==='auth/wrong-password')       msg = 'Contraseña incorrecta.';
      if(e.code==='auth/invalid-credential')   msg = 'Correo o contraseña incorrectos.';
      if(e.code==='auth/invalid-email')        msg = 'Formato de correo inválido.';
      if(e.code==='auth/too-many-requests')    msg = 'Demasiados intentos. Espera unos minutos.';
      if(e.code==='auth/operation-not-allowed') msg = 'Email/Password no habilitado en Firebase.';
      if(e.code==='auth/network-request-failed') msg = 'Sin conexión a internet.';
      showLoginError(msg);
      console.error('Login error:', e.code, e.message);
    });
}

function enterApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.body.classList.add('app-mode');
  var av = document.getElementById('cur-av');
  av.textContent = ini(curUser.name);
  av.style.background = curUser.color+'22';
  av.style.color = curUser.color;
  document.getElementById('cur-nm').textContent = curUser.name;
  document.getElementById('login-btn').textContent = 'Iniciar sesión';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').style.opacity = '1';
  loadAppData();
}

// ═══════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════
function loadAppData(){
  setSyncUI('saving','Cargando...');

  // Load projects
  db.collection('projects').get().then(function(snap){
    if(snap.empty){
      projects = DGROUPS.map(function(name,i){
        return {id:'p'+(i+1),name:name,desc:'',color:AVCOLORS[i]||'#1a73e8',status:'activo',start:'',end:'',owner:'',createdBy:curUser.name,createdTs:nowStr()};
      });
      projects.forEach(function(p){ db.collection('projects').doc(p.id).set(p); });
    } else {
      projects = snap.docs.map(function(d){ return d.data(); });
    }
    // Real-time projects
    db.collection('projects').onSnapshot(function(s){
      projects = s.docs.map(function(d){ return d.data(); });
      if(curView==='projects') renderProjectsView();
    });
  });

  // Load tasks
  db.collection('tasks').get().then(function(snap){
    if(snap.empty){
      tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
      tasks.forEach(function(t){ db.collection('tasks').doc(t.id).set(cleanObj(t)); });
    } else {
      tasks = snap.docs.map(function(d){ return d.data(); });
    }
    // Real-time tasks
    db.collection('tasks').onSnapshot(function(s){
      tasks = s.docs.map(function(d){ return d.data(); });
      if(curView==='gantt') renderGantt();
      setSyncUI('ok','En línea ✓');
    });
    switchView('gantt');
  });

  // Load comments
  db.collection('comments').get().then(function(snap){
    comments = snap.docs.map(function(d){ return d.data(); });
  });

  // Load daily logs
  db.collection('dailylogs').get().then(function(snap){
    dailyLogs = snap.docs.map(function(d){ return d.data(); });
  });

  // Load history
  db.collection('history').doc('main').get().then(function(doc){
    if(doc.exists) history = doc.data().items || [];
  });
}

// ═══════════════════════════════════
// FIREBASE SAVE
// ═══════════════════════════════════
function fbSaveTask(task){
  setSyncUI('saving','Guardando...');
  var clean = cleanObj(task);
  clean.pct = parseInt(clean.pct)||0;
  clean.fav = clean.fav===true;
  ['name','proj','resp','start','end','sem','assign','dep','note','status','updBy','updTs'].forEach(function(f){
    if(clean[f]===null||clean[f]===undefined) clean[f]='';
  });
  db.collection('tasks').doc(clean.id).set(clean)
    .then(function(){ setSyncUI('ok','En línea ✓'); })
    .catch(function(e){
      setSyncUI('error','Error');
      if(e.code==='permission-denied') toast('🔒 Sin permisos en Firebase. Revisa las Reglas de Firestore.');
      else toast('⚠️ Error: '+e.message);
    });
}

function switchView(v){
  curView=v;
  ['gantt','daily','hist','projects'].forEach(function(x){
    var el=document.getElementById('view-'+x);
    if(!el) return;
    if(x==='gantt') el.style.display=v==='gantt'?'flex':'none';
    else el.classList.toggle('hidden',x!==v);
    var btn=document.getElementById('tnav-'+x);
    if(btn) btn.classList.toggle('on',x===v);
  });
  document.getElementById('secbar').style.display=v==='gantt'?'flex':'none';
  if(v==='gantt') renderGantt();
  else if(v==='daily') renderDailySetup();
  else if(v==='hist') renderHist();
  else if(v==='projects') renderProjectsView();
}

function shiftDays(n){ ganttStart=addD(ganttStart,n); renderGantt(); }
function goToday(){
  ganttStart=addD(new Date(),-30); renderGantt();
  setTimeout(function(){
    var bw=document.getElementById('cal-bw'),tl=document.getElementById('tline');
    if(tl&&!tl.classList.contains('hidden')) bw.scrollLeft=Math.max(0,parseInt(tl.style.left)-200);
  },100);
}

function renderGantt(){
  var respF=(document.getElementById('resp-fil')||{}).value||'ALL';
  var today=new Date(); today.setHours(0,0,0,0);
  var dates=[]; for(var i=0;i<ganttDays;i++) dates.push(addD(ganttStart,i));
  var dl=document.getElementById('date-range-lbl');
  if(dl) dl.textContent=ganttStart.toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'})+' — '+dates[dates.length-1].toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'});
  var months=[];
  dates.forEach(function(d){ var k=d.getFullYear()+'-'+d.getMonth(); if(!months.length||months[months.length-1].key!==k) months.push({key:k,label:MONTHS_L[d.getMonth()]+' '+d.getFullYear(),count:1}); else months[months.length-1].count++; });
  document.getElementById('month-hd').innerHTML=months.map(function(m){ return '<div class="month-seg" style="min-width:'+(m.count*28)+'px;width:'+(m.count*28)+'px;">'+m.label+'</div>'; }).join('');
  document.getElementById('day-hd').innerHTML=dates.map(function(d){ var isT=ymd(d)===ymd(today),isWE=d.getDay()===0||d.getDay()===6; return '<div class="day-col'+(isT?' tod':'')+(isWE?' we':'')+'"><div class="dow">'+DAYS[d.getDay()][0]+'</div><div class="dom">'+d.getDate()+'</div></div>'; }).join('');
  var filtTasks=respF==='ALL'?tasks:tasks.filter(function(t){ return t.resp===respF; });
  var groups=[]; tasks.forEach(function(t){ if(groups.indexOf(t.proj)<0) groups.push(t.proj); });
  var leftHTML='', bodyRows=[];
  var allPct=tasks.length?Math.round(tasks.reduce(function(a,t){ return a+(t.status==='completado'?100:(t.pct||0)); },0)/tasks.length):0;
  leftHTML+='<div class="grow grp" style="background:#e8eaed;"><div class="gcell-n"><span style="font-size:12px;font-weight:700;">APP CAFIVER</span></div><div class="gcell-p" style="color:#1c1e21;">'+allPct+'%</div></div>';
  bodyRows.push({type:'overall'});
  groups.forEach(function(g){
    var gAll=tasks.filter(function(t){ return t.proj===g; });
    var gF=filtTasks.filter(function(t){ return t.proj===g; });
    if(!gAll.length) return;
    var gPct=Math.round(gAll.reduce(function(a,t){ return a+(t.status==='completado'?100:(t.pct||0)); },0)/gAll.length);
    var isC=collapsed.has(g);
    leftHTML+='<div class="grow grp"><div class="gcell-n"><button class="gtog'+(isC?'':' open')+'" onclick="toggleGrp(\''+g.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">▶</button><span style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+g+'</span></div><div class="gcell-p">'+gPct+'%</div></div>';
    bodyRows.push({type:'grp',g:g});
    if(!isC){
      gF.forEach(function(t){
        var ep=t.status==='completado'?100:(t.pct||0);
        var pC=ep===100?'#34a853':ep>50?'#1a73e8':'#f9ab00';
        leftHTML+='<div class="grow" id="lr_'+t.id+'" ondblclick="openPanel(\''+t.id+'\')" onclick="selRow(\''+t.id+'\')"><div class="gcell-n"><div class="task-indent"></div><span class="task-lbl" title="'+t.name+'">'+(t.fav?'⭐ ':'')+t.name+'</span></div><div class="gcell-p" style="color:'+pC+'">'+ep+'%</div></div>';
        bodyRows.push({type:'task',t:t});
      });
    }
  });
  document.getElementById('gl-body').innerHTML=leftHTML;
  var cb=document.getElementById('cal-b'); cb.style.width=(ganttDays*28)+'px'; cb.innerHTML='';
  bodyRows.forEach(function(row){
    var rd=document.createElement('div'); rd.className='cal-row'+(row.type==='grp'||row.type==='overall'?' grp-r':'');
    dates.forEach(function(d){ var isWE=d.getDay()===0||d.getDay()===6,isT=ymd(d)===ymd(today); var c=document.createElement('div'); c.className='dcell'+(isWE?' we':'')+(isT?' tod':''); rd.appendChild(c); });
    if(row.type==='task'&&row.t.start&&row.t.end){
      var t=row.t,ts=pd(t.start),te=pd(t.end),s0=pd(ymd(ganttStart));
      var left=dBetween(s0,ts),width=Math.max(1,dBetween(ts,te)+1);
      var lPx=left*28,wPx=width*28-2;
      if(lPx<ganttDays*28&&lPx+wPx>0){
        var bc=BAR_COLORS[t.resp]||'#1a73e8',ep=t.status==='completado'?100:(t.pct||0);
        var bar=document.createElement('div'); bar.className='bar'; bar.style.left=Math.max(0,lPx)+'px'; bar.style.width=wPx+'px'; bar.title=t.name+' — '+ep+'%';
        bar.innerHTML='<div class="bar-bg" style="background:'+bc+';opacity:.22;"></div><div class="bar-fill" style="width:'+ep+'%;background:'+bc+';opacity:.88;"></div><span class="bar-txt">'+t.name+'</span>';
        bar.ondblclick=function(){ openPanel(t.id); }; bar.onclick=function(e){ e.stopPropagation(); selRow(t.id); }; rd.appendChild(bar);
      }
    }
    cb.appendChild(rd);
  });
  var tl=document.getElementById('tline'),tOff=dBetween(pd(ymd(ganttStart)),today);
  if(tOff>=0&&tOff<ganttDays){ tl.style.left=(tOff*28+14)+'px'; tl.classList.remove('hidden'); }else tl.classList.add('hidden');
  var bw=document.getElementById('cal-bw'),gb=document.getElementById('gl-body');
  bw.onscroll=null; gb.onscroll=null;
  var _scrolling=false;
  bw.addEventListener('scroll',function(){
    if(_scrolling)return; _scrolling=true;
    gb.scrollTop=bw.scrollTop;
    // Shift calendar headers horizontally
    var mhd=document.getElementById('month-hd');
    var dhd=document.getElementById('day-hd');
    if(mhd) mhd.scrollLeft=bw.scrollLeft;
    if(dhd) dhd.scrollLeft=bw.scrollLeft;
    setTimeout(function(){ _scrolling=false; },0);
  });
  gb.addEventListener('scroll',function(){
    if(_scrolling)return; _scrolling=true;
    bw.scrollTop=gb.scrollTop;
    setTimeout(function(){ _scrolling=false; },0);
  });
}
function toggleGrp(g){ if(collapsed.has(g))collapsed.delete(g);else collapsed.add(g); renderGantt(); }
function selRow(tid){ document.querySelectorAll('.grow.sel').forEach(function(e){ e.classList.remove('sel'); }); var el=document.getElementById('lr_'+tid); if(el)el.classList.add('sel'); }

function openPanel(tid){
  var t=tasks.find(function(x){ return x.id===tid; }); if(!t) return;
  openTaskId=tid; selRow(tid);
  document.getElementById('dp-title').value=t.name;
  var ep=t.status==='completado'?100:(t.pct||0);
  document.getElementById('dp-pct-n').value=ep; document.getElementById('dp-pct-s').value=ep; syncPctBar();
  document.getElementById('dp-start').value=t.start||''; document.getElementById('dp-end').value=t.end||'';
  document.getElementById('dp-fav').textContent=t.fav?'⭐':'☆';
  dpTab(dpCurTab);
  document.getElementById('dp').classList.add('open'); document.getElementById('dp-overlay').classList.add('on');
}
function closePanel(){ document.getElementById('dp').classList.remove('open'); document.getElementById('dp-overlay').classList.remove('on'); openTaskId=null; document.querySelectorAll('.grow.sel').forEach(function(e){ e.classList.remove('sel'); }); }
function syncPctBar(){ var v=parseInt(document.getElementById('dp-pct-n').value)||0; document.getElementById('dp-pct-bar').style.width=v+'%'; }

function dpSave(field, val){
  var t=tasks.find(function(x){ return x.id===openTaskId; }); if(!t) return;
  var prevAssign=t.assign||'';
  if(field==='pct'){ t.pct=parseInt(val)||0; if(t.pct===100) t.status='completado'; }
  else t[field]=val;
  t.updBy=curUser.name; t.updTs=nowStr();
  if(field==='assign') notifyAssign(t,prevAssign);
  addH(t,field,String(val).slice(0,60));
  fbSaveTask(t);
  if(curView==='gantt') renderGantt();
}
function dpFav(){ var t=tasks.find(function(x){ return x.id===openTaskId; }); if(!t)return; t.fav=!t.fav; document.getElementById('dp-fav').textContent=t.fav?'⭐':'☆'; fbSaveTask(t); toast(t.fav?'Favorito agregado':'Favorito removido'); }
function dpDelete(){
  var t=tasks.find(function(x){ return x.id===openTaskId; }); if(!t)return;
  confirmAction('¿Eliminar "'+t.name.slice(0,50)+'"?','Esta acción no se puede deshacer.',function(){
    addH(t,'eliminó',t.name);
    db.collection('tasks').doc(t.id).delete().then(function(){ closePanel(); toast('Tarea eliminada'); });
  });
}

        '<div class="dp-fr"><div class="dp-fk">Asignado a</div><div class="dp-fv"><input type="text" value="'+((t.assign||'').replace(/"/g,'&quot;'))+'" onchange="dpSave(\'assign\',this.value)"></div></div>'+
        '<div class="dp-fr"><div class="dp-fk">Proyecto</div><div class="dp-fv"><select onchange="dpSave(\'proj\',this.value)">'+grps.map(function(p){ return '<option value="'+p+'"'+(t.proj===p?' selected':'')+'>'+p+'</option>'; }).join('')+'</select></div></div>'+

function renderProjectsView(){
  var wrap=document.getElementById('projects-wrap'); if(!wrap) return;
  var sC={activo:'#34a853',completado:'#1a73e8','en pausa':'#f9ab00',cancelado:'#ea4335'};
  var sB={activo:'#e6f4ea',completado:'#e8f0fe','en pausa':'#fef7e0',cancelado:'#fce8e6'};
  var sL={activo:'Activo',completado:'Completado','en pausa':'En pausa',cancelado:'Cancelado'};
  var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;"><h2 style="font-size:16px;font-weight:700;">Proyectos</h2><button class="btn btn-blue" onclick="openNewProject()">+ Nuevo proyecto</button></div>';
  if(!projects.length){ html+='<div class="tbl-box"><div class="empty-state">Sin proyectos aún.</div></div>'; }
  else{
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;">';
    projects.forEach(function(p){
      var tc=tasks.filter(function(t){ return t.proj===p.name; }).length;
      var dc=tasks.filter(function(t){ return t.proj===p.name&&t.status==='completado'; }).length;
      var pct=tc?Math.round(dc/tc*100):0;
      html+='<div style="background:#fff;border:1px solid #e0e2e6;border-radius:12px;overflow:hidden;">'+
        '<div style="height:5px;background:'+p.color+';"></div>'+
        '<div style="padding:14px 16px;">'+
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">'+
            '<div style="display:flex;align-items:center;gap:10px;">'+
              '<div style="width:36px;height:36px;border-radius:9px;background:'+p.color+'22;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">📁</div>'+
              '<div><div style="font-size:13px;font-weight:700;">'+p.name+'</div>'+(p.owner?'<div style="font-size:11px;color:#5f6368;">👤 '+p.owner+'</div>':'')+'</div>'+
            '</div>'+
            '<span style="font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+(sB[p.status]||'#f0f1f3')+';color:'+(sC[p.status]||'#888')+';white-space:nowrap;">'+(sL[p.status]||p.status)+'</span>'+
          '</div>'+
          (p.desc?'<div style="font-size:12px;color:#5f6368;margin-bottom:10px;line-height:1.5;">'+p.desc+'</div>':'')+
          (p.start||p.end?'<div style="font-size:11px;color:#9aa0a6;margin-bottom:10px;">📅 '+(p.start||'—')+' → '+(p.end||'—')+'</div>':'')+
          '<div style="margin-bottom:12px;">'+
            '<div style="display:flex;justify-content:space-between;font-size:11px;color:#5f6368;margin-bottom:4px;">'+
              '<span>'+tc+' tarea'+(tc!==1?'s':'')+' · '+dc+' completada'+(dc!==1?'s':'')+'</span>'+
              '<span style="font-weight:700;color:'+p.color+';">'+pct+'%</span>'+
            '</div>'+
            '<div style="height:6px;background:#f0f1f3;border-radius:3px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+p.color+';border-radius:3px;"></div></div>'+
          '</div>'+
          '<div style="display:flex;gap:6px;">'+
            '<button class="btn btn-sm" onclick="openEditProject(\''+p.id+'\')" style="flex:1;justify-content:center;">✏️ Editar</button>'+
            '<button class="btn btn-sm" onclick="switchView(\'gantt\')" style="flex:1;justify-content:center;">▦ Gantt</button>'+
            '<button class="btn btn-sm" onclick="deleteProject(\''+p.id+'\')" style="color:#ea4335;background:#fce8e6;border-color:transparent;">🗑</button>'+
          '</div>'+
        '</div></div>';
    });
    html+='</div>';
  }
  wrap.innerHTML=html;
}

function renderDailySetup(){
  var td=new Date().toISOString().slice(0,10);
  document.getElementById('daily-wrap').innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"><h2 style="font-size:16px;font-weight:700;">Captura diaria</h2><input type="date" id="daily-date" value="'+td+'" onchange="renderDailyContent()" style="font-size:12px;padding:5px 8px;border:1.5px solid #e0e2e6;border-radius:6px;outline:none;"></div><div id="daily-inner"></div>';
  renderDailyContent();
}
function renderDailyContent(){
  var dk=(document.getElementById('daily-date')||{}).value||new Date().toISOString().slice(0,10);
  var logs=dailyLogs.filter(function(l){ return l.date===dk; });
  var stLbl={pendiente:'Pendiente','en progreso':'En progreso',completado:'Completado',bloqueado:'Bloqueado'};
  var html='<div class="tbl-box" style="margin-bottom:12px;"><div class="tbl-hdr"><span>'+logs.length+' registro(s)</span><button class="btn btn-sm" onclick="exportDay(\''+dk+'\')">⬇ CSV</button></div>';
  if(logs.length){
    html+='<div style="overflow-x:auto;"><table><thead><tr>'+['Hora','Usuario','Tarea','Estado','%','Sem.','Comentario',''].map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr></thead><tbody>'+
      logs.map(function(l){ var sc=l.sem==='g'?'#34a853':l.sem==='y'?'#f9ab00':'#ea4335';
        return '<tr><td style="font-family:monospace;white-space:nowrap;">'+l.time+'</td><td>'+l.user+'</td><td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.taskName+'</td><td>'+(stLbl[l.status]||l.status)+'</td><td style="font-weight:700;">'+l.pct+'%</td><td style="text-align:center;"><span style="width:10px;height:10px;border-radius:50%;display:inline-block;background:'+sc+';"></span></td><td style="color:#5f6368;">'+(l.comment||'—')+'</td><td><button class="btn btn-sm" onclick="deleteLog(\''+l.id+'\')">🗑</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }else html+='<div class="empty-state">Sin registros para este día.</div>';
  html+='</div><div class="tbl-box"><div class="tbl-hdr"><span>+ Nuevo registro</span></div><div style="padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Tarea</label><select id="log-task" onchange="prefillLog()" style="min-width:200px;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;">'+tasks.map(function(t){ return '<option value="'+t.id+'">'+t.name.slice(0,50)+'</option>'; }).join('')+'</select></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Estado</label><select id="log-status" style="font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"><option value="pendiente">Pendiente</option><option value="en progreso">En progreso</option><option value="completado">Completado</option><option value="bloqueado">Bloqueado</option></select></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">% Avance</label><input type="number" id="log-pct" min="0" max="100" value="0" style="width:70px;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"></div>'+
    '<div><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Semáforo</label><select id="log-sem" style="font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"><option value="g">🟢</option><option value="y">🟡</option><option value="r">🔴</option></select></div>'+
    '<div style="flex:1;min-width:150px;"><label style="font-size:10px;font-weight:700;color:#5f6368;text-transform:uppercase;display:block;margin-bottom:4px;">Comentario</label><input type="text" id="log-comment" placeholder="¿Qué avanzaste hoy?" style="width:100%;font-size:12px;padding:6px 8px;border:1.5px solid #e0e2e6;border-radius:6px;"></div>'+
    '<button class="btn btn-blue" onclick="addLog(\''+dk+'\')">+ Registrar</button></div></div>';
  document.getElementById('daily-inner').innerHTML=html;
  prefillLog();
}
function prefillLog(){ var tid=(document.getElementById('log-task')||{}).value; var t=tasks.find(function(x){ return x.id===tid; }); if(t){ document.getElementById('log-status').value=t.status; document.getElementById('log-pct').value=t.pct||0; document.getElementById('log-sem').value=t.sem; } }
function addLog(dk){
  var tid=document.getElementById('log-task').value; var t=tasks.find(function(x){ return x.id===tid; }); if(!t) return;
  var status=document.getElementById('log-status').value;
  var pct=Math.min(100,Math.max(0,parseInt(document.getElementById('log-pct').value)||0));
  var sem=document.getElementById('log-sem').value;
  var comment=document.getElementById('log-comment').value.trim();
  var now=new Date(), time=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  var log={id:uid(),date:dk,time:time,taskId:tid,taskName:t.name,taskProj:t.proj,user:curUser.name,userColor:curUser.color,status:status,pct:pct,sem:sem,comment:comment};
  dailyLogs.push(log);
  db.collection('dailylogs').doc(log.id).set(log);
  t.status=status; t.pct=pct; t.sem=sem; if(pct===100) t.status='completado';
  t.updBy=curUser.name; t.updTs=nowStr();
  fbSaveTask(t); renderDailyContent(); toast('Registro guardado');
}
function deleteLog(lid){ confirmAction('¿Eliminar registro?','',function(){ db.collection('dailylogs').doc(lid).delete(); dailyLogs=dailyLogs.filter(function(x){ return x.id!==lid; }); renderDailyContent(); toast('Eliminado'); }); }
function exportDay(dk){
  var logs=dailyLogs.filter(function(l){ return l.date===dk; }); if(!logs.length){toast('Sin registros');return;}
  var csv='Hora,Usuario,Proyecto,Tarea,Estado,% Avance,Semáforo,Comentario\n';
  logs.forEach(function(l){ csv+=l.time+',"'+l.user+'","'+l.taskProj+'","'+l.taskName+'","'+l.status+'",'+l.pct+'%,"'+(l.sem==='g'?'Verde':l.sem==='y'?'Amarillo':'Rojo')+'","'+(l.comment||'')+'"\n'; });
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})); a.download='reporte_'+dk+'.csv'; a.click(); toast('CSV exportado');
}

// ═══════════════════════════════════
// EMAIL NOTIFY
// ═══════════════════════════════════
function notifyAssign(task, prevAssign){
  var newA=(task.assign||'').trim(); if(!newA||newA===prevAssign) return;
  newA.split(/[\/,&+]/).map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(name){
    var entry=null;
    Object.keys(USER_DIR).forEach(function(email){ if(USER_DIR[email].name.toLowerCase().indexOf(name.toLowerCase())>=0) entry={email:email,name:USER_DIR[email].name}; });
    if(entry){
      try{
        emailjs.send('service_sxw6hr8','template_ouuy72c',{
          to_email:entry.email, to_name:entry.name, from_name:'GanttTracker Pro',
          subject:'Tarea asignada: '+task.name,
          message:'Hola '+entry.name+',\n\nSe te asignó:\nProyecto: '+task.proj+'\nTarea: '+task.name+'\nInicio: '+(task.start||'—')+'\nFin: '+(task.end||'—')+'\nEstado: '+task.status+'\nAsignado por: '+curUser.name+'\n\nSaludos,\nGanttTracker Pro'
        }).then(function(){ toast('📧 Correo enviado a '+entry.name); });
      }catch(e){}
    }
  });
}

// ═══════════════════════════════════
// CHANGE PASSWORD
// ═══════════════════════════════════
function openChPass(){
  document.getElementById('chpass-new').value='';
  document.getElementById('chpass-confirm').value='';
  document.getElementById('chpass-error').style.display='none';
  document.getElementById('chpass-overlay').classList.remove('hidden');
}
function closeChPass(){ document.getElementById('chpass-overlay').classList.add('hidden'); }
function doChPass(){
  var np = document.getElementById('chpass-new').value;
  var cp = document.getElementById('chpass-confirm').value;
  var errEl = document.getElementById('chpass-error');
  errEl.style.display='none';
  if(!np){ errEl.textContent='Ingresa la nueva contraseña.'; errEl.style.display='block'; return; }
  if(np.length<6){ errEl.textContent='La contraseña debe tener al menos 6 caracteres.'; errEl.style.display='block'; return; }
  if(np!==cp){ errEl.textContent='Las contraseñas no coinciden.'; errEl.style.display='block'; return; }
  var user = auth.currentUser;
  if(!user){ errEl.textContent='No hay sesión activa.'; errEl.style.display='block'; return; }
  user.updatePassword(np)
    .then(function(){
      closeChPass();
      toast('✅ Contraseña actualizada correctamente');
    })
    .catch(function(e){
      var msg = 'Error al cambiar contraseña.';
      if(e.code==='auth/requires-recent-login') msg='Por seguridad, cierra sesión, vuelve a entrar y luego cambia tu contraseña.';
      if(e.code==='auth/weak-password') msg='La contraseña es muy débil. Usa al menos 6 caracteres.';
      errEl.textContent=msg; errEl.style.display='block';
    });
}

// CONFIRM
// ═══════════════════════════════════
var _cb=null;
function confirmAction(title,msg,cb){ _cb=cb; document.getElementById('confirm-title').textContent=title; document.getElementById('confirm-msg').textContent=msg; document.getElementById('confirm-overlay').classList.remove('hidden'); }
function closeConfirm(){ document.getElementById('confirm-overlay').classList.add('hidden'); _cb=null; }
document.getElementById('confirm-ok').addEventListener('click', function(){ if(_cb)_cb(); closeConfirm(); });

// Wire pct slider and number input
var pctSlider = document.getElementById('dp-pct-s');
var pctNum    = document.getElementById('dp-pct-n');
if(pctSlider){
  pctSlider.addEventListener('input', function(){
    pctNum.value = this.value;
    syncPctBar();
  });
  pctSlider.addEventListener('change', function(){
    var v = parseInt(this.value)||0;
    pctNum.value = v;
    syncPctBar();
    dpSave('pct', v);
  });
}
if(pctNum){
  pctNum.addEventListener('change', function(){
    var v = Math.min(100, Math.max(0, parseInt(this.value)||0));
    this.value = v;
    if(pctSlider) pctSlider.value = v;
    syncPctBar();
    dpSave('pct', v);
  });
}

// AUTH STATE — auto login if session exists
// ═══════════════════════════════════
auth.onAuthStateChanged(function(user){
  if(user){
    var email=user.email.toLowerCase();
    var profile=USER_DIR[email]||{name:email.split('@')[0],color:'#1a73e8'};
    curUser={uid:user.uid,email:email,name:profile.name,color:profile.color};
    enterApp();
  }
});
