<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttTracker Pro — APP CAFIVER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --c-bg:#0a0e1a;--c-bg2:#111827;--c-bg3:#1a2235;--c-bg4:#212d42;
  --c-border:#2a3550;--c-border2:#1e2d45;
  --c-blue:#3b82f6;--c-blue2:#2563eb;--c-blue-glow:rgba(59,130,246,.25);
  --c-green:#10b981;--c-yellow:#f59e0b;--c-red:#ef4444;--c-purple:#8b5cf6;
  --c-text:#f0f4ff;--c-text2:#94a3b8;--c-text3:#4a5568;
  --c-usr:#3b82f6;--c-ti:#10b981;--c-prov:#f59e0b;--c-shared:#8b5cf6;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,.4);--shadow-lg:0 8px 48px rgba(0,0,0,.6);
  --trans:.18s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
body{font-family:'Inter',sans-serif;background:var(--c-bg);color:var(--c-text);font-size:13px;min-height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:2px;}
.hidden{display:none!important;}

/* ── INPUTS & BUTTONS ── */
input,select,textarea{font-family:'Inter',sans-serif;background:var(--c-bg3);border:1px solid var(--c-border);color:var(--c-text);border-radius:var(--radius-xs);font-size:12px;outline:none;transition:border-color var(--trans),box-shadow var(--trans);}
input:focus,select:focus,textarea:focus{border-color:var(--c-blue);box-shadow:0 0 0 3px var(--c-blue-glow);}
select option{background:var(--c-bg3);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--radius-xs);border:1px solid var(--c-border);background:var(--c-bg3);color:var(--c-text);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all var(--trans);white-space:nowrap;line-height:1;}
.btn:hover{background:var(--c-bg4);border-color:var(--c-border2);}
.btn-primary{background:var(--c-blue);border-color:var(--c-blue);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--c-blue2);border-color:var(--c-blue2);box-shadow:0 0 20px var(--c-blue-glow);}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--c-red);}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--c-text2);}
.btn-ghost:hover{background:var(--c-bg3);color:var(--c-text);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-icon{width:30px;height:30px;padding:0;border-radius:var(--radius-xs);}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,130,246,.15) 0%,transparent 70%);pointer-events:none;}
.login-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 70%);top:-200px;left:50%;transform:translateX(-50%);pointer-events:none;}
.lcard{background:rgba(17,24,39,.85);backdrop-filter:blur(20px);border:1px solid var(--c-border);border-radius:20px;padding:2.5rem 2rem;width:400px;max-width:96vw;box-shadow:var(--shadow-lg);position:relative;z-index:1;}
.lcard-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--c-blue),var(--c-purple));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 0 32px rgba(59,130,246,.4);}
.lcard-logo span{font-size:28px;font-weight:800;color:#fff;}
.lcard h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;}
.lcard p{font-size:12px;color:var(--c-text2);text-align:center;margin-bottom:2rem;}
.fi-wrap{margin-bottom:14px;}
.fi-wrap label{display:block;font-size:10px;font-weight:600;color:var(--c-text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.fi-wrap input{width:100%;padding:10px 12px;}
.fi-wrap-pw{position:relative;}
.fi-wrap-pw input{padding-right:40px;}
.pw-tog{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--c-text3);font-size:16px;line-height:1;transition:color var(--trans);}
.pw-tog:hover{color:var(--c-text2);}
.login-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;border-radius:var(--radius-xs);padding:9px 12px;font-size:12px;margin-bottom:14px;display:none;line-height:1.5;}
.login-submit{width:100%;padding:11px;font-size:14px;font-weight:600;border-radius:var(--radius-sm);margin-top:4px;}

/* ── TOPBAR ── */
#topbar{height:54px;background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;z-index:100;position:relative;}
.tb-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--c-blue),var(--c-purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;}
.tb-title{font-size:14px;font-weight:700;margin-right:4px;}
.tb-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(59,130,246,.15);color:var(--c-blue);border:1px solid rgba(59,130,246,.25);}
.tb-nav{display:flex;gap:2px;margin-left:8px;}
.tb-nav-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--c-text2);cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;transition:all var(--trans);}
.tb-nav-btn:hover{background:var(--c-bg3);color:var(--c-text);}
.tb-nav-btn.on{background:rgba(59,130,246,.15);color:var(--c-blue);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-ok{background:var(--c-green);box-shadow:0 0 6px var(--c-green);}
.sync-saving{background:var(--c-blue);animation:pulse 1s infinite;}
.sync-err{background:var(--c-red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-lbl{font-size:11px;font-weight:500;}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;background:var(--c-bg3);border:1px solid var(--c-border);cursor:pointer;transition:all var(--trans);}
.user-chip:hover{border-color:var(--c-blue);}
.uav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.user-chip-name{font-size:12px;font-weight:500;}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#app-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.view-wrap{flex:1;overflow:auto;padding:1.5rem;}

/* ── SECBAR ── */
#secbar{height:42px;background:rgba(17,24,39,.8);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;}
.secbar-sep{width:1px;height:20px;background:var(--c-border);}
.secbar-lbl{font-size:11px;color:var(--c-text2);}
#date-range-lbl{font-size:11px;font-weight:500;color:var(--c-text2);min-width:200px;text-align:center;}
.resp-filter-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;}
.resp-filter-wrap select{padding:3px 8px;font-size:11px;}

/* ── GANTT ── */
#view-gantt{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.gantt-headers{display:flex;flex-shrink:0;border-bottom:1px solid var(--c-border);}
.gh-left{width:400px;min-width:400px;flex-shrink:0;border-right:1px solid var(--c-border);background:var(--c-bg2);}
.gh-left-inner{height:54px;display:grid;grid-template-columns:1fr 70px;align-items:center;padding:0 10px;}
.gh-left-inner span{font-size:10px;font-weight:600;color:var(--c-text3);text-transform:uppercase;letter-spacing:.06em;}
.gh-right{flex:1;overflow:hidden;}
.month-hd{height:22px;display:flex;background:var(--c-bg2);border-bottom:1px solid var(--c-border);}
.month-seg{display:flex;align-items:center;font-size:10px;font-weight:600;color:var(--c-text3);border-right:1px solid var(--c-border);padding:0 8px;white-space:nowrap;overflow:hidden;text-transform:uppercase;letter-spacing:.04em;}
.day-hd{display:flex;height:32px;background:var(--c-bg2);}
.day-col{width:28px;min-width:28px;border-right:1px solid var(--c-border2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.day-col .dow{font-size:8px;color:var(--c-text3);font-weight:500;line-height:1;}
.day-col .dom{font-size:10px;font-weight:600;color:var(--c-text2);line-height:1.6;}
.day-col.tod .dom{background:var(--c-blue);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;}
.day-col.tod .dow{color:var(--c-blue);}
.day-col.we{background:rgba(255,255,255,.01);}
.gantt-body-wrap{flex:1;display:flex;overflow:hidden;}
.gl-body{width:400px;min-width:400px;flex-shrink:0;border-right:1px solid var(--c-border);overflow-y:scroll;overflow-x:hidden;scrollbar-width:none;}
.gl-body::-webkit-scrollbar{display:none;}
.grow{height:36px;min-height:36px;display:grid;grid-template-columns:1fr 70px;align-items:center;border-bottom:1px solid var(--c-border2);cursor:pointer;transition:background var(--trans);user-select:none;}
.grow:hover:not(.grow-grp){background:rgba(59,130,246,.06);}
.grow-grp{background:var(--c-bg2);cursor:default;}
.grow-overall{background:rgba(59,130,246,.05);}
.grow.sel{background:rgba(59,130,246,.1)!important;}
.gcell-n{display:flex;align-items:center;gap:6px;padding:0 10px;overflow:hidden;}
.gcell-pct{text-align:center;font-size:11px;font-weight:700;padding-right:10px;color:var(--c-text2);}
.gtog{background:none;border:none;cursor:pointer;color:var(--c-text3);font-size:9px;padding:2px;flex-shrink:0;transition:transform .2s;line-height:1;}
.gtog.open{transform:rotate(90deg);}
.g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.task-lbl{font-size:12px;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.task-lbl.grp-lbl{font-weight:600;font-size:12px;color:var(--c-text);}
.cal-bw{flex:1;overflow:auto;position:relative;}
.cal-b{position:relative;}
.cal-row{height:36px;min-height:36px;display:flex;position:relative;border-bottom:1px solid var(--c-border2);}
.cal-row.grp-r{background:var(--c-bg2);}
.cal-row.overall-r{background:rgba(59,130,246,.03);}
.dcell{width:28px;min-width:28px;border-right:1px solid var(--c-border2);height:100%;flex-shrink:0;}
.dcell.we{background:rgba(255,255,255,.008);}
.dcell.tod{background:rgba(59,130,246,.06);}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:20px;border-radius:4px;cursor:pointer;overflow:hidden;display:flex;align-items:center;transition:filter var(--trans);}
.gbar:hover{filter:brightness(1.15);}
.gbar-bg{position:absolute;inset:0;border-radius:4px;}
.gbar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;opacity:.9;}
.gbar-txt{position:relative;z-index:1;font-size:10px;font-weight:600;color:#fff;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.tline{position:absolute;top:0;bottom:0;width:2px;background:var(--c-blue);opacity:.7;z-index:10;pointer-events:none;}
.tline::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--c-blue);}

/* ── DETAIL PANEL ── */
#dp{position:fixed;top:0;right:0;width:520px;height:100vh;background:var(--c-bg2);border-left:1px solid var(--c-border);z-index:300;display:flex;flex-direction:column;box-shadow:-8px 0 48px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
#dp.open{transform:translateX(0);}
.dp-prog-bar{height:3px;background:var(--c-blue);transition:width .3s;flex-shrink:0;}
.dp-hd{padding:16px 20px 12px;border-bottom:1px solid var(--c-border);flex-shrink:0;}
.dp-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.dp-title{flex:1;font-size:16px;font-weight:700;border:none;outline:none;background:transparent;resize:none;line-height:1.4;color:var(--c-text);}
.dp-acts{display:flex;gap:4px;flex-shrink:0;}
.dp-meta{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.dp-mf label{display:block;font-size:9px;font-weight:600;color:var(--c-text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.pct-blk{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius-xs);padding:6px 10px;}
.pct-num{font-size:18px;font-weight:800;color:var(--c-blue);width:44px;border:none;background:transparent;outline:none;font-family:'Inter',sans-serif;}
.pct-range{flex:1;min-width:80px;accent-color:var(--c-blue);}
.dp-date{padding:6px 8px;}
.dp-tabs{display:flex;border-bottom:1px solid var(--c-border);padding:0 20px;flex-shrink:0;}
.dp-tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--c-text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all var(--trans);font-family:'Inter',sans-serif;}
.dp-tab:hover{color:var(--c-text);}
.dp-tab.on{color:var(--c-blue);border-bottom-color:var(--c-blue);}
.dp-body{flex:1;overflow-y:auto;padding:16px 20px;}
.dp-sec{margin-bottom:16px;}
.dp-sec-t{font-size:10px;font-weight:600;color:var(--c-text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.dp-fr{display:grid;grid-template-columns:120px 1fr;align-items:center;padding:8px 0;border-bottom:1px solid var(--c-border2);}
.dp-fr:last-child{border-bottom:none;}
.dp-fk{font-size:12px;color:var(--c-text2);font-weight:500;}
.dp-fv input,.dp-fv select,.dp-fv textarea{width:100%;padding:5px 8px;}
.dp-fv textarea{resize:vertical;min-height:80px;line-height:1.5;}
.sem-row{display:flex;gap:8px;flex-wrap:wrap;}
.sem-opt{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--c-border);font-size:11px;font-weight:600;transition:all var(--trans);}
.s-g{color:var(--c-green);}.s-g.on{background:rgba(16,185,129,.1);border-color:var(--c-green);}
.s-y{color:var(--c-yellow);}.s-y.on{background:rgba(245,158,11,.1);border-color:var(--c-yellow);}
.s-r{color:var(--c-red);}.s-r.on{background:rgba(239,68,68,.1);border-color:var(--c-red);}
.semdot{width:8px;height:8px;border-radius:50%;}
.notes-area{width:100%;min-height:130px;font-size:13px;padding:10px;border-radius:var(--radius-xs);outline:none;line-height:1.6;resize:vertical;}
.c-box{display:flex;gap:8px;margin-bottom:14px;}
.c-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:2px;}
.c-inp{flex:1;padding:8px 10px;border-radius:var(--radius-xs);}
.c-item{display:flex;gap:8px;margin-bottom:10px;}
.c-txt{flex:1;background:var(--c-bg3);border-radius:var(--radius-xs);padding:8px 10px;border:1px solid var(--c-border2);}
.c-author{font-size:11px;font-weight:600;margin-bottom:3px;color:var(--c-text);}
.c-body{font-size:12px;color:var(--c-text2);line-height:1.5;}
.c-time{font-size:10px;color:var(--c-text3);margin-top:4px;}
.ev-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-xs);background:var(--c-bg3);border:1px solid var(--c-border2);margin-bottom:8px;}
.ev-icon{font-size:20px;flex-shrink:0;}
.ev-info{flex:1;min-width:0;}
.ev-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-meta{font-size:10px;color:var(--c-text3);margin-top:2px;}
.ev-link{font-size:11px;color:var(--c-blue);text-decoration:none;}
.ev-link:hover{text-decoration:underline;}
#dp-overlay{position:fixed;inset:0;z-index:299;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);display:none;}
#dp-overlay.on{display:block;}

/* ── MODALS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;}
.modal{background:var(--c-bg2);border:1px solid var(--c-border);border-radius:var(--radius);padding:1.75rem;width:520px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-sm{width:380px;}
.modal h2{font-size:16px;font-weight:700;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;}
.modal h2 .micon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.mf{margin-bottom:12px;}
.mf label{display:block;font-size:10px;font-weight:600;color:var(--c-text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.mf input,.mf select,.mf textarea{width:100%;padding:8px 10px;}
.mf textarea{resize:vertical;min-height:70px;line-height:1.5;}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--c-border);}
.color-grid{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all var(--trans);}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}

/* ── VIEWS ── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.page-hd h2{font-size:18px;font-weight:700;}
.page-hd p{font-size:12px;color:var(--c-text2);margin-top:2px;}

/* projects grid */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.proj-card{background:var(--c-bg2);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;transition:all var(--trans);cursor:pointer;}
.proj-card:hover{border-color:var(--c-blue);box-shadow:0 0 24px rgba(59,130,246,.12);transform:translateY(-2px);}
.proj-card-top{height:6px;}
.proj-card-body{padding:16px;}
.proj-card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.proj-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.proj-card-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.proj-card-owner{font-size:11px;color:var(--c-text2);}
.status-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.sb-activo{background:rgba(16,185,129,.12);color:var(--c-green);border:1px solid rgba(16,185,129,.25);}
.sb-pausa{background:rgba(245,158,11,.12);color:var(--c-yellow);border:1px solid rgba(245,158,11,.25);}
.sb-completado{background:rgba(59,130,246,.12);color:var(--c-blue);border:1px solid rgba(59,130,246,.25);}
.sb-cancelado{background:rgba(239,68,68,.12);color:var(--c-red);border:1px solid rgba(239,68,68,.25);}
.proj-prog{margin:12px 0;}

try{emailjs.init('uZ97TAiXZcf9-B1vp');}catch(e){}

// ════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ════════════════════════════════════════

var tasks=[],projects=[],history=[],dailyLogs=[],comments=[],evidencias=[];

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ini(n){return(n||'?').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);}
function nowStr(){return new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});}
function ymd(d){return d instanceof Date?d.toISOString().slice(0,10):d;}
function pd(s){return s?new Date(s+'T12:00:00'):null;}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function dBetween(a,b){return Math.round((b-a)/86400000);}
function cleanObj(o){return JSON.parse(JSON.stringify(o,function(k,v){return v===undefined?null:v;}));}

function setSyncUI(state,msg){
  var dot=document.getElementById('sync-dot'),lbl=document.getElementById('sync-lbl');
  if(!dot)return;
  dot.className='sync-dot sync-'+state;
  lbl.textContent=msg;
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},3000);
}
function addH(t,campo,val){
  if(!curUser)return;
  history.unshift({ts:nowStr(),user:curUser.name,proj:t.proj||'',task:t.name,campo:campo,val:String(val).slice(0,80)});
  if(history.length>500)history=history.slice(0,500);
  db.collection('history').doc('main').set({items:history.slice(0,200)}).catch(function(){});
}
function projColor(projName){
  var p=projects.find(function(x){return x.name===projName;});
  return p?p.color:'#3b82f6';
}
function respBadge(r){return '<span class="rbadge rb-'+r+'">'+RESP_LABEL[r]+'</span>';}
function semDot(s){var c=s==='g'?'var(--c-green)':s==='y'?'var(--c-yellow)':'var(--c-red)';return '<span style="width:9px;height:9px;border-radius:50%;background:'+c+';display:inline-block;box-shadow:0 0 6px '+c+';"></span>';}

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════
document.getElementById('login-btn').addEventListener('click',doLogin);
document.getElementById('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
document.getElementById('login-email').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
document.getElementById('pw-tog').addEventListener('click',function(){
  var i=document.getElementById('login-pass');
  i.type=i.type==='password'?'text':'password';
  this.textContent=i.type==='password'?'👁':'🙈';
});

function showLoginErr(msg){var el=document.getElementById('login-err');el.textContent=msg;el.style.display='block';}
function doLogin(){
  var email=(document.getElementById('login-email').value||'').trim().toLowerCase();
  var pass=(document.getElementById('login-pass').value||'').trim();
  var btn=document.getElementById('login-btn');
  document.getElementById('login-err').style.display='none';
  if(!email){showLoginErr('Escribe tu correo.');return;}
  if(!pass){showLoginErr('Escribe tu contraseña.');return;}
  btn.textContent='Entrando...';btn.disabled=true;btn.style.opacity='.7';
  auth.signInWithEmailAndPassword(email,pass)
    .then(function(c){
      var p=USER_DIR[email]||{name:email.split('@')[0],color:'#3b82f6'};
      curUser={uid:c.user.uid,email:email,name:p.name,color:p.color};
      enterApp();
    })
    .catch(function(e){
      btn.textContent='Iniciar sesión';btn.disabled=false;btn.style.opacity='1';
      var m='Correo o contraseña incorrectos.';
      if(e.code==='auth/user-not-found')m='Usuario no encontrado.';
      if(e.code==='auth/wrong-password')m='Contraseña incorrecta.';
      if(e.code==='auth/invalid-credential')m='Credenciales incorrectas.';
      if(e.code==='auth/too-many-requests')m='Demasiados intentos. Espera unos minutos.';
      if(e.code==='auth/network-request-failed')m='Sin conexión a internet.';
      showLoginErr(m);
    });
}
function enterApp(){

// DATA
// ════════════════════════════════════════
function loadData(){
  setSyncUI('saving','Cargando...');
  // Projects real-time
  db.collection('projects').onSnapshot(function(s){
    projects=s.docs.map(function(d){return d.data();});
    if(curView==='projects')renderProjects();
    if(curView==='gantt')renderGantt();
  });
  // Tasks real-time
  db.collection('tasks').onSnapshot(function(s){
    tasks=s.docs.map(function(d){return d.data();});
    if(curView==='gantt')renderGantt();
    setSyncUI('ok','En línea ✓');
  });
  // Comments
  db.collection('comments').onSnapshot(function(s){comments=s.docs.map(function(d){return d.data();});});
  // Evidencias
  db.collection('evidencias').onSnapshot(function(s){evidencias=s.docs.map(function(d){return d.data();});});
  // Daily logs
  db.collection('dailylogs').get().then(function(s){dailyLogs=s.docs.map(function(d){return d.data();});});
  // History
  db.collection('history').doc('main').get().then(function(doc){if(doc.exists)history=doc.data().items||[];});
  switchView('gantt');
}
function fbSaveTask(t){
  setSyncUI('saving','Guardando...');
  var c=cleanObj(t);
  c.pct=parseInt(c.pct)||0;c.fav=c.fav===true;
  ['name','proj','resp','start','end','sem','assign','dep','note','status','updBy','updTs'].forEach(function(f){if(c[f]===null||c[f]===undefined)c[f]='';});
  db.collection('tasks').doc(c.id).set(c)
    .then(function(){setSyncUI('ok','En línea ✓');})
    .catch(function(e){setSyncUI('err','Error');toast('⚠️ '+e.message);});
}

function switchView(v){
  curView=v;
  ['gantt','projects','daily','hist'].forEach(function(x){
    var el=document.getElementById('view-'+x);if(!el)return;
    el.classList.remove("hidden");el.style.display=(x==="gantt"?(v==="gantt"?"flex":"none"):(v===x?"block":"none"));
    if(x==='gantt')el.style.flexDirection='column';
    var btn=document.getElementById('tnav-'+x);if(btn)btn.classList.toggle('on',x===v);
  });
  document.getElementById('secbar').style.display=v==='gantt'?'flex':'none';
  if(v==='gantt')renderGantt();
  else if(v==='projects')renderProjects();
  else if(v==='daily')renderDailySetup();
  else if(v==='hist')renderHist();
}

function shiftDays(n){ganttStart=addD(ganttStart,n);renderGantt();}
function goToday(){
  ganttStart=addD(new Date(),-14);renderGantt();
  setTimeout(function(){var bw=document.getElementById('cal-bw'),tl=document.getElementById('tline');if(tl&&!tl.classList.contains('hidden'))bw.scrollLeft=Math.max(0,parseInt(tl.style.left)-200);},80);
}
function renderGantt(){
  var respF=(document.getElementById('resp-fil')||{}).value||'ALL';
  var today=new Date();today.setHours(0,0,0,0);
  var dates=[];for(var i=0;i<ganttDays;i++)dates.push(addD(ganttStart,i));
  var dl=document.getElementById('date-range-lbl');
  if(dl)dl.textContent=ganttStart.toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'})+' — '+dates[dates.length-1].toLocaleDateString('es-MX',{month:'short',day:'numeric',year:'numeric'});

  // Month headers
  var months=[];
  dates.forEach(function(d){var k=d.getFullYear()+'-'+d.getMonth();if(!months.length||months[months.length-1].key!==k)months.push({key:k,label:MONTHS[d.getMonth()]+' '+d.getFullYear(),count:1});else months[months.length-1].count++;});
  document.getElementById('month-hd').innerHTML=months.map(function(m){return'<div class="month-seg" style="min-width:'+(m.count*28)+'px;width:'+(m.count*28)+'px;">'+m.label+'</div>';}).join('');
  document.getElementById('day-hd').innerHTML=dates.map(function(d){var isT=ymd(d)===ymd(today),isWE=d.getDay()===0||d.getDay()===6;return'<div class="day-col'+(isT?' tod':'')+(isWE?' we':'')+'"><div class="dow">'+DAYS[d.getDay()][0]+'</div><div class="dom">'+d.getDate()+'</div></div>';}).join('');

  var filtTasks=respF==='ALL'?tasks:tasks.filter(function(t){return t.resp===respF;});
  var groups=[];
  // Use project order
  projects.forEach(function(p){if(tasks.some(function(t){return t.proj===p.name;}))groups.push(p.name);});
  tasks.forEach(function(t){if(groups.indexOf(t.proj)<0)groups.push(t.proj);});

  var leftHTML='',bodyRows=[];
  // Overall row
  var allPct=tasks.length?Math.round(tasks.reduce(function(a,t){return a+(t.status==='completado'?100:(t.pct||0));},0)/tasks.length):0;
  leftHTML+='<div class="grow grow-overall"><div class="gcell-n"><span class="task-lbl grp-lbl" style="color:var(--c-blue);">📊 APP CAFIVER</span></div><div class="gcell-pct" style="color:var(--c-blue);">'+allPct+'%</div></div>';
  bodyRows.push({type:'overall'});

  groups.forEach(function(g){
    var gAll=tasks.filter(function(t){return t.proj===g;});
    var gF=filtTasks.filter(function(t){return t.proj===g;});
    if(!gAll.length)return;
    var gPct=Math.round(gAll.reduce(function(a,t){return a+(t.status==='completado'?100:(t.pct||0));},0)/gAll.length);
    var isC=collapsed.has(g);
    var pc=projColor(g);
    leftHTML+='<div class="grow grow-grp"><div class="gcell-n"><button class="gtog'+(isC?'':' open')+'" onclick="toggleGrp(\''+g.replace(/'/g,"\\'")+'\')">▶</button><div class="g-dot" style="background:'+pc+';box-shadow:0 0 6px '+pc+'44;"></div><span class="task-lbl grp-lbl">'+g+'</span></div><div class="gcell-pct" style="color:'+pc+'">'+gPct+'%</div></div>';
    bodyRows.push({type:'grp',g:g,color:pc});
    if(!isC){
      gF.forEach(function(t){
        var ep=t.status==='completado'?100:(t.pct||0);
        var pc2=ep===100?'var(--c-green)':ep>50?'var(--c-blue)':'var(--c-yellow)';
        leftHTML+='<div class="grow" id="lr_'+t.id+'" ondblclick="openPanel(\''+t.id+'\')" onclick="selRow(\''+t.id+'\')"><div class="gcell-n" style="padding-left:22px;">'+semDot(t.sem||'g')+'<span class="task-lbl" title="'+t.name+'">'+(t.fav?'⭐ ':'')+t.name+'</span></div><div class="gcell-pct" style="color:'+pc2+'">'+ep+'%</div></div>';
        bodyRows.push({type:'task',t:t});
      });
    }
  });

  document.getElementById('gl-body').innerHTML=leftHTML;
  var cb=document.getElementById('cal-b');cb.style.width=(ganttDays*28)+'px';cb.innerHTML='';

  bodyRows.forEach(function(row){
    var rd=document.createElement('div');
    rd.className='cal-row'+(row.type==='grp'?' grp-r':row.type==='overall'?' overall-r':'');
    dates.forEach(function(d){var isWE=d.getDay()===0||d.getDay()===6,isT=ymd(d)===ymd(today);var c=document.createElement('div');c.className='dcell'+(isWE?' we':'')+(isT?' tod':'');rd.appendChild(c);});
    if(row.type==='task'&&row.t.start&&row.t.end){
      var t=row.t,ts=pd(t.start),te=pd(t.end),s0=pd(ymd(ganttStart));
      var left=dBetween(s0,ts),width=Math.max(1,dBetween(ts,te)+1);
      var lPx=left*28,wPx=width*28-2;
      if(lPx<ganttDays*28&&lPx+wPx>0){
        var bc=BAR_COLORS[t.resp]||'#3b82f6',ep=t.status==='completado'?100:(t.pct||0);
        var bar=document.createElement('div');bar.className='gbar';
        bar.style.left=Math.max(0,lPx)+'px';bar.style.width=wPx+'px';bar.title=t.name+' — '+ep+'%';
        bar.innerHTML='<div class="gbar-bg" style="background:'+bc+';opacity:.18;"></div><div class="gbar-fill" style="width:'+ep+'%;background:'+bc+';"></div><span class="gbar-txt">'+t.name+'</span>';
        bar.ondblclick=function(){openPanel(t.id);};bar.onclick=function(e){e.stopPropagation();selRow(t.id);};
        rd.appendChild(bar);
      }
    }
    cb.appendChild(rd);
  });

  // Today line
  var tl=document.getElementById('tline'),tOff=dBetween(pd(ymd(ganttStart)),today);
  if(tOff>=0&&tOff<ganttDays){tl.style.left=(tOff*28+14)+'px';tl.classList.remove('hidden');}else tl.classList.add('hidden');

  // Sync scroll
  var bw=document.getElementById('cal-bw'),gb=document.getElementById('gl-body');
  var _s=false;
  bw.onscroll=function(){if(_s)return;_s=true;gb.scrollTop=bw.scrollTop;document.getElementById('month-hd').scrollLeft=bw.scrollLeft;document.getElementById('day-hd').scrollLeft=bw.scrollLeft;setTimeout(function(){_s=false;},0);};
  gb.onscroll=function(){if(_s)return;_s=true;bw.scrollTop=gb.scrollTop;setTimeout(function(){_s=false;},0);};
}
function toggleGrp(g){if(collapsed.has(g))collapsed.delete(g);else collapsed.add(g);renderGantt();}
function selRow(tid){document.querySelectorAll('.grow.sel').forEach(function(e){e.classList.remove('sel');});var el=document.getElementById('lr_'+tid);if(el)el.classList.add('sel');}

function openPanel(tid){
  var t=tasks.find(function(x){return x.id===tid;});if(!t)return;
  openTaskId=tid;selRow(tid);
  document.getElementById('dp-title').value=t.name;
  var ep=t.status==='completado'?100:(t.pct||0);
  document.getElementById('dp-pct-n').value=ep;document.getElementById('dp-pct-s').value=ep;syncProgBar();
  document.getElementById('dp-start').value=t.start||'';document.getElementById('dp-end').value=t.end||'';
  document.getElementById('dp-fav').textContent=t.fav?'⭐':'☆';
  dpTab(dpCurTab);

function closePanel(){document.getElementById('dp').classList.remove('open');document.getElementById('dp-overlay').classList.remove('on');openTaskId=null;document.querySelectorAll('.grow.sel').forEach(function(e){e.classList.remove('sel');});}
function syncProgBar(){var v=parseInt(document.getElementById('dp-pct-n').value)||0;document.getElementById('dp-prog-bar').style.width=v+'%';}
function dpSave(field,val){
  var t=tasks.find(function(x){return x.id===openTaskId;});if(!t)return;
  var prev=t.assign||'';
  if(field==='pct'){t.pct=parseInt(val)||0;if(t.pct===100)t.status='completado';}else t[field]=val;
  t.updBy=curUser.name;t.updTs=nowStr();
  if(field==='assign')notifyAssign(t,prev);
  addH(t,field,val);fbSaveTask(t);
  if(curView==='gantt')renderGantt();
}
function dpFav(){var t=tasks.find(function(x){return x.id===openTaskId;});if(!t)return;t.fav=!t.fav;document.getElementById('dp-fav').textContent=t.fav?'⭐':'☆';fbSaveTask(t);toast(t.fav?'⭐ Favorito agregado':'Favorito removido');}
function dpDelete(){
  var t=tasks.find(function(x){return x.id===openTaskId;});if(!t)return;
  confirmAction('¿Eliminar tarea?','"'+t.name.slice(0,60)+'" — Esta acción no se puede deshacer.',function(){
    addH(t,'eliminó',t.name);
    db.collection('tasks').doc(t.id).delete().then(function(){closePanel();toast('Tarea eliminada');});
  });
}

function addComment(){var inp=document.getElementById('c-inp');if(!inp||!inp.value.trim())return;var c={id:uid(),taskId:openTaskId,user:curUser.name,color:curUser.color,text:inp.value.trim(),ts:nowStr()};comments.push(c);db.collection('comments').doc(c.id).set(c);dpTab('comments');toast('Comentario agregado');}
function addEvidencia(){

function openEditProject(pid){
  var p=projects.find(function(x){return x.id===pid;});if(!p)return;
  editProjId=pid;selProjColor_=p.color||PROJ_COLORS[0];
  document.getElementById('proj-modal-title').textContent='Editar proyecto';
  document.getElementById('pm-name').value=p.name||'';document.getElementById('pm-desc').value=p.desc||'';
  document.getElementById('pm-owner').value=p.owner||'';document.getElementById('pm-status').value=p.status||'activo';
  document.getElementById('pm-start').value=p.start||'';document.getElementById('pm-end').value=p.end||'';
  document.getElementById('pm-color-grid').innerHTML=buildColorGrid(selProjColor_);
  document.getElementById('proj-modal').classList.remove('hidden');
}
function closeProjModal(){document.getElementById('proj-modal').classList.add('hidden');editProjId=null;}
function saveProjModal(){
  var name=document.getElementById('pm-name').value.trim();if(!name){toast('⚠️ El nombre es obligatorio.');return;}
  var p={id:editProjId||uid(),name:name,desc:document.getElementById('pm-desc').value.trim(),
    color:selProjColor_,status:document.getElementById('pm-status').value,
    start:document.getElementById('pm-start').value,end:document.getElementById('pm-end').value,
    owner:document.getElementById('pm-owner').value.trim(),
    createdBy:curUser?curUser.name:'',updTs:nowStr()};
  db.collection('projects').doc(p.id).set(p)
    .then(function(){closeProjModal();toast(editProjId?'✅ Proyecto actualizado':'✅ Proyecto creado');})
    .catch(function(e){toast('⚠️ '+e.message);});
}
function deleteProject(pid){
  var p=projects.find(function(x){return x.id===pid;});if(!p)return;
  var tc=tasks.filter(function(t){return t.proj===p.name;}).length;
  confirmAction('¿Eliminar proyecto?','"'+p.name+'"'+(tc?' — tiene '+tc+' tarea(s) asociada(s).':''),function(){
    db.collection('projects').doc(pid).delete().then(function(){toast('Proyecto eliminado');});
  });
}

  }else{

        '<div><div class="proj-card-title">'+p.name+'</div>'+(p.owner?'<div class="proj-card-owner">👤 '+p.owner+'</div>':'')+'</div>'+
        '</div>'+
        '<span class="status-badge '+(sbClass[p.status]||'sb-activo')+'">'+(sbLbl[p.status]||p.status)+'</span>'+
        '</div>'+
        (p.desc?'<div style="font-size:12px;color:var(--c-text2);margin-bottom:10px;line-height:1.6;">'+p.desc+'</div>':'')+

        '<div class="proj-prog">'+

// ════════════════════════════════════════
// ADD TASK
// ════════════════════════════════════════
function openAddTask(){
  fillProjSelect('');
  var td=new Date().toISOString().slice(0,10);
  ['tm-name','tm-assign','tm-dep','tm-note'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('tm-start').value=td;document.getElementById('tm-end').value=td;
  document.getElementById('tm-resp').value='U';document.getElementById('tm-sem').value='g';
  document.getElementById('tm-status').value='pendiente';document.getElementById('tm-pct').value='0';
  document.getElementById('task-modal').classList.remove('hidden');
}
function openAddTaskFor(projName){
  openAddTask();
  var sel=document.getElementById('tm-proj');
  for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===projName){sel.selectedIndex=i;break;}}
}
function fillProjSelect(selected){
  var gs=projects.map(function(p){return p.name;});
  tasks.forEach(function(t){if(gs.indexOf(t.proj)<0)gs.push(t.proj);});
  document.getElementById('tm-proj').innerHTML=gs.map(function(g){return'<option value="'+g+'"'+(g===selected?' selected':'')+'>'+g+'</option>';}).join('');
}
function closeTaskModal(){document.getElementById('task-modal').classList.add('hidden');}
function saveTaskModal(){
  var name=document.getElementById('tm-name').value.trim();if(!name){toast('⚠️ El nombre es obligatorio.');return;}
  var s=document.getElementById('tm-start').value,e=document.getElementById('tm-end').value;if(e<s)e=s;
  var t={id:uid(),name:name,proj:document.getElementById('tm-proj').value,
    resp:document.getElementById('tm-resp').value,start:s,end:e,
    sem:document.getElementById('tm-sem').value,assign:document.getElementById('tm-assign').value.trim(),
    dep:document.getElementById('tm-dep').value.trim(),status:document.getElementById('tm-status').value,
    pct:Math.min(100,Math.max(0,parseInt(document.getElementById('tm-pct').value)||0)),
    note:document.getElementById('tm-note').value.trim(),fav:false,updBy:curUser.name,updTs:nowStr()};
  notifyAssign(t,'');fbSaveTask(t);closeTaskModal();toast('✅ Tarea agregada');
}

// ════════════════════════════════════════
// DAILY
// ════════════════════════════════════════
function renderDailySetup(){
  var td=new Date().toISOString().slice(0,10);
  document.getElementById('daily-inner').innerHTML=
    '<div class="page-hd"><div><h2>Captura diaria</h2><p>Registra el avance diario por tarea</p></div>'+
    '<input type="date" id="daily-date" value="'+td+'" onchange="renderDailyContent()" style="padding:7px 10px;"></div>'+
    '<div id="daily-content"></div>';
  renderDailyContent();
}
function renderDailyContent(){
  var dk=(document.getElementById('daily-date')||{}).value||new Date().toISOString().slice(0,10);
  var logs=dailyLogs.filter(function(l){return l.date===dk;});
  var stLbl={pendiente:'Pendiente','en progreso':'En progreso',completado:'Completado',bloqueado:'Bloqueado'};
  var html='<div class="daily-form">'+
    '<div class="daily-form-title">+ Nuevo registro</div>'+
    '<div class="daily-form-row">'+
    '<div class="mf"><label>Tarea</label><select id="log-task" onchange="prefillLog()" style="padding:7px 8px;width:100%;">'+tasks.map(function(t){return'<option value="'+t.id+'">'+t.name.slice(0,60)+'</option>';}).join('')+'</select></div>'+
    '<div class="mf"><label>Estado</label><select id="log-status" style="padding:7px 8px;width:100%;"><option value="pendiente">Pendiente</option><option value="en progreso">En progreso</option><option value="completado">Completado</option><option value="bloqueado">Bloqueado</option></select></div>'+
    '<div class="mf"><label>% Avance</label><input type="number" id="log-pct" min="0" max="100" value="0" style="padding:7px 8px;width:80px;"></div>'+
    '<div class="mf"><label>Semáforo</label><select id="log-sem" style="padding:7px 8px;"><option value="g">🟢</option><option value="y">🟡</option><option value="r">🔴</option></select></div>'+
    '<div class="mf" style="flex:2;"><label>Comentario</label><input type="text" id="log-comment" placeholder="¿Qué avanzaste hoy?" style="padding:7px 10px;width:100%;"></div>'+
    '<div class="mf" style="align-self:flex-end;"><button class="btn btn-primary" onclick="addLog(\''+dk+'\')">+ Registrar</button></div>'+
    '</div></div>';

  html+='<div class="daily-table-wrap"><div class="daily-table-hd"><span>'+logs.length+' registro(s) — '+dk+'</span><button class="btn btn-sm" onclick="exportDay(\''+dk+'\')">⬇ CSV</button></div>';
  if(logs.length){
    html+='<div style="overflow-x:auto;"><table><thead><tr><th>Hora</th><th>Usuario</th><th>Tarea</th><th>Estado</th><th>%</th><th>Sem.</th><th>Comentario</th><th></th></tr></thead><tbody>'+
      logs.map(function(l){return'<tr><td style="font-family:monospace;white-space:nowrap;">'+l.time+'</td><td>'+l.user+'</td><td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.taskName+'</td><td>'+(stLbl[l.status]||l.status)+'</td><td style="font-weight:700;">'+l.pct+'%</td><td>'+semDot(l.sem)+'</td><td style="color:var(--c-text2);">'+(l.comment||'—')+'</td><td><button class="btn btn-danger btn-sm" onclick="deleteLog(\''+l.id+'\')">✕</button></td></tr>';}).join('')+'</tbody></table></div>';
  }else{html+='<div class="empty-msg">Sin registros para este día.</div>';}
  html+='</div>';
  document.getElementById('daily-content').innerHTML=html;
  prefillLog();
}
function prefillLog(){var tid=(document.getElementById('log-task')||{}).value;var t=tasks.find(function(x){return x.id===tid;});if(t){document.getElementById('log-status').value=t.status;document.getElementById('log-pct').value=t.pct||0;document.getElementById('log-sem').value=t.sem||'g';}}
function addLog(dk){
  var tid=document.getElementById('log-task').value;var t=tasks.find(function(x){return x.id===tid;});if(!t)return;
  var status=document.getElementById('log-status').value;
  var pct=Math.min(100,Math.max(0,parseInt(document.getElementById('log-pct').value)||0));
  var sem=document.getElementById('log-sem').value;
  var comment=document.getElementById('log-comment').value.trim();
  var now=new Date(),time=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  var log={id:uid(),date:dk,time:time,taskId:tid,taskName:t.name,taskProj:t.proj,user:curUser.name,status:status,pct:pct,sem:sem,comment:comment};
  dailyLogs.push(log);
  db.collection('dailylogs').doc(log.id).set(log);
  t.status=status;t.pct=pct;t.sem=sem;if(pct===100)t.status='completado';
  t.updBy=curUser.name;t.updTs=nowStr();
  fbSaveTask(t);renderDailyContent();toast('✅ Registro guardado');
}
function deleteLog(lid){confirmAction('¿Eliminar registro?','',function(){db.collection('dailylogs').doc(lid).delete();dailyLogs=dailyLogs.filter(function(x){return x.id!==lid;});renderDailyContent();toast('Eliminado');});}
function exportDay(dk){
  var logs=dailyLogs.filter(function(l){return l.date===dk;});if(!logs.length){toast('Sin registros');return;}
  var csv='Hora,Usuario,Proyecto,Tarea,Estado,% Avance,Semáforo,Comentario\n';
  logs.forEach(function(l){csv+=l.time+',"'+l.user+'","'+l.taskProj+'","'+l.taskName+'","'+l.status+'",'+l.pct+'%,"'+(l.sem==='g'?'Verde':l.sem==='y'?'Amarillo':'Rojo')+'","'+(l.comment||'')+'"\n';});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download='reporte_'+dk+'.csv';a.click();toast('CSV exportado');
}

// ════════════════════════════════════════
// EMAIL NOTIFY
// ════════════════════════════════════════
function notifyAssign(task,prevAssign){
  var newA=(task.assign||'').trim();if(!newA||newA===prevAssign)return;
  newA.split(/[\/,&+]/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(name){
    var entry=null;
    Object.keys(USER_DIR).forEach(function(email){if(USER_DIR[email].name.toLowerCase().indexOf(name.toLowerCase())>=0)entry={email:email,name:USER_DIR[email].name};});
    if(entry){try{emailjs.send('service_sxw6hr8','template_ouuy72c',{to_email:entry.email,to_name:entry.name,from_name:'GanttTracker Pro',subject:'Tarea asignada: '+task.name,message:'Hola '+entry.name+',\n\nSe te asignó la tarea:\nProyecto: '+task.proj+'\nTarea: '+task.name+'\nInicio: '+(task.start||'—')+'\nFin: '+(task.end||'—')+'\nAsignado por: '+curUser.name+'\n\nSaludos,\nGanttTracker Pro'}).then(function(){toast('📧 Correo enviado a '+entry.name);});}catch(e){}}
  });
}

// ════════════════════════════════════════
// CHANGE PASSWORD
// ════════════════════════════════════════
function openChPass(){document.getElementById('chpass-new').value='';document.getElementById('chpass-confirm').value='';document.getElementById('chpass-err').style.display='none';document.getElementById('chpass-overlay').classList.remove('hidden');}
function closeChPass(){document.getElementById('chpass-overlay').classList.add('hidden');}
function doChPass(){
  var np=document.getElementById('chpass-new').value,cp=document.getElementById('chpass-confirm').value,err=document.getElementById('chpass-err');
  err.style.display='none';
  if(!np){err.textContent='Ingresa la nueva contraseña.';err.style.display='block';return;}
  if(np.length<6){err.textContent='Mínimo 6 caracteres.';err.style.display='block';return;}
  if(np!==cp){err.textContent='Las contraseñas no coinciden.';err.style.display='block';return;}
  auth.currentUser.updatePassword(np)
    .then(function(){closeChPass();toast('✅ Contraseña actualizada');})
    .catch(function(e){var m='Error al cambiar contraseña.';if(e.code==='auth/requires-recent-login')m='Por seguridad, cierra sesión, vuelve a entrar y luego cambia.';err.textContent=m;err.style.display='block';});
}

// ════════════════════════════════════════
// CONFIRM
// ════════════════════════════════════════
function confirmAction(title,msg,cb){_cb=cb;document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-msg').textContent=msg;document.getElementById('confirm-modal').classList.remove('hidden');}
function closeConfirm(){document.getElementById('confirm-modal').classList.add('hidden');_cb=null;}
document.getElementById('confirm-ok').addEventListener('click',function(){if(_cb)_cb();closeConfirm();});
</script>
